    @font-face{font-family:'display';font-weight:800;src:url(data:font/ttf;base64,) format('truetype');}@font-face{font-family:'body';font-weight:600;src:url(data:font/ttf;base64,) format('truetype');}
    .display{font-family:'display',Georgia,serif;font-weight:800}
    .body{font-family:'body',Georgia,serif;font-weight:600}
    .fade{opacity:0;animation:fade 1.1s ease-out forwards}
    .rise{opacity:0;animation:rise 1.2s cubic-bezier(.2,.7,.2,1) forwards}
    .blink{animation:blink 2.6s ease-in-out infinite}
    @keyframes fade{to{opacity:1}}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
    @keyframes draw{to{stroke-dashoffset:0}}
    .glint{animation:glint 6s ease-in-out 2.4s infinite}@keyframes glint{0%,62%{transform:skewX(-20deg) translateX(0)}100%{transform:skewX(-20deg) translateX(324px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}
