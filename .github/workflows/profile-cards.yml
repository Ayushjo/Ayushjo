# Builds the README's stat cards inside this repo, so the profile doesn't
# depend on the shared public endpoints (which get paused or rate limited).
name: Update profile cards

on:
  schedule:
    - cron: "0 0 * * *" # daily
  push:
    branches: [main]
    paths: [".github/workflows/profile-cards.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

env:
  # GITHUB_TOKEN only sees public activity. To count private contributions, add a
  # PAT (repo + read:user) as the PROFILE_CARDS_TOKEN secret.
  TOKEN: ${{ secrets.PROFILE_CARDS_TOKEN || secrets.GITHUB_TOKEN }}
  CARD_STYLE: theme=transparent&hide_border=true&title_color=d9a441&icon_color=c8141b&text_color=c9b99a&ring_color=c8141b

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&rank_icon=github&${{ env.CARD_STYLE }}
          path: profile/stats.svg
          token: ${{ env.TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&${{ env.CARD_STYLE }}
          path: profile/top-langs.svg
          token: ${{ env.TOKEN }}

      - name: Streak card
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&theme=transparent&hide_border=true&ring=c8141b&fire=d9a441&currStreakLabel=d9a441&sideLabels=c9b99a&currStreakNum=c9b99a&sideNums=c9b99a&dates=8a7a5e&stroke=3a2c22&disable_animations=true
          path: profile/streak.svg

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update profile cards" || exit 0
          git pull --rebase
          git push

  summary:
    needs: stats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ env.TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          TIME_ZONE: Asia/Kolkata
          THEME: transparent
